[versions]
# Kotlin
kotlin = "2.3.20-Beta1"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"

# AndroidX
androidx-activity = "1.12.2"

# Compose
compose-bom = "2026.01.00"

# Testing
kotest = "6.0.7"

# Plugins
android-gradle = "9.0.0"

# Navigation
voyager = "1.1.0-beta03"

# Google
baselineprofile = "1.5.0-alpha01"

[libraries]
# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# AndroidX
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.require = "1.9.1" }
androidx-window = { module = "androidx.window:window", version.require = "1.5.1" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.require = "1.2.0" }

# Compose BOM
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }

# Compose
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-animation-core = { module = "androidx.compose.animation:animation-core" }

# Testing
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
androidx-junit = { module = "androidx.test.ext:junit", version.require = "1.3.0" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.require = "3.7.0" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.require = "2.3.0" }

# Performance
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.require = "1.4.1" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.require = "1.4.1" }

# Navigation
voyager-core = { module = "cafe.adriel.voyager:voyager-core", version.ref = "voyager" }
voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-screenmodel = { module = "cafe.adriel.voyager:voyager-screenmodel", version.ref = "voyager" }
voyager-transitions = { module = "cafe.adriel.voyager:voyager-transitions", version.ref = "voyager" }

# Build Tooling
versioning-plugin = { module = "xyz.dussim:versioning-plugin", version.require = "1.0.0" }

# Logging
logback-classic = { module = "ch.qos.logback:logback-classic", version.require = "1.5.24" }

# HTML and CSS
kotlinx-html = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version.require = "0.12.0" }
kotlin-css = { module = "org.jetbrains.kotlin-wrappers:kotlin-css", version.require = "2026.1.5" }

# Custom
data-model = { module = "xyz.dussim:data-model" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle" }
android-library = { id = "com.android.library", version.ref = "android-gradle" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.require = "14.0.1" }
gradle-versions = { id = "com.github.ben-manes.versions", version.require = "0.53.0" }
modulegraph = { id = "dev.iurysouza.modulegraph", version.require = "0.13.0" }
android-test = { id = "com.android.test", version.ref = "android-gradle" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
gradle-ssh = { id = "xyz.dussim.gradle-ssh", version.require = "0.0.5" }
docker-java-application = { id = "com.bmuschko.docker-java-application", version.require = "10.0.0" }
stability-analyzer = { id = "com.github.skydoves.compose.stability.analyzer", version = "0.6.6" }

[bundles]
voyager = ["voyager-navigator", "voyager-screenmodel", "voyager-transitions"]
html-css = ["kotlinx-html", "kotlin-css"]
