[versions]
# Kotlin
kotlin = "2.2.21"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"

# Ktor
kotlinxSerializationCore = "1.9.0"
ktor = "3.3.2"

# AndroidX
androidx-core = "1.17.0"
androidx-lifecycle = "2.10.0"
androidx-activity = "1.12.0"

# Compose
compose-bom = "2025.11.01"

# Testing
kotest = "6.0.5"

# Plugins
android-gradle = "8.12.3"

# Navigation
voyager = "1.1.0-beta03"

# Google
baselineprofile = "1.4.1"

[libraries]
# Kotlin
androidx-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-material3 = { module = "androidx.compose.material3:material3" }
androidx-material3-window-size-class1 = { module = "androidx.compose.material3:material3-window-size-class" }
androidx-ui = { module = "androidx.compose.ui:ui" }
androidx-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
data-model = { module = "xyz.dussim:data-model" }
dussim-data-model = { module = "xyz.dussim:data-model" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlin-compose-compiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerializationCore" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.strictly = "1.9.1" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.strictly = "1.8.9" }
androidx-window = { module = "androidx.window:window", version.strictly = "1.5.1" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.strictly = "1.2.0" }

# Compose BOM
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }

# Compose
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }

# Testing
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }

# Build tools
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "android-gradle" }
ktlint-gradle = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.strictly = "14.0.1" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-resources = { module = "io.ktor:ktor-client-resources", version.ref = "ktor" }
ktor-ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
versioning-plugin = { module = "xyz.dussim:versioning-plugin", version.strictly = "1.0.0" }
modulegraph = { module = "dev.iurysouza:modulegraph", version.strictly = "0.13.0" }
gradle-versions = { module = "com.github.ben-manes:gradle-versions-plugin", version.strictly = "0.53.0" }
twitter-compose-rules = { module = "com.twitter.compose.rules:ktlint", version.strictly = "0.0.26" }

# Navigation
voyager-core = { module = "cafe.adriel.voyager:voyager-core", version.ref = "voyager" }
voyager-navigator = { module = "cafe.adriel.voyager:voyager-navigator", version.ref = "voyager" }
voyager-screenmodel = { module = "cafe.adriel.voyager:voyager-screenmodel", version.ref = "voyager" }
voyager-transitions = { module = "cafe.adriel.voyager:voyager-transitions", version.ref = "voyager" }

# Ktor
ktor-server-html-builder = { module = "io.ktor:ktor-server-html-builder-jvm", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktor" }
ktor-server-compression = { module = "io.ktor:ktor-server-compression-jvm", version.ref = "ktor" }
ktor-server-host-common = { module = "io.ktor:ktor-server-host-common-jvm", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-server-resources = { module = "io.ktor:ktor-server-resources", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.strictly = "1.5.21" }

# HTML and CSS
kotlinx-html = { module = "org.jetbrains.kotlinx:kotlinx-html-jvm", version.strictly = "0.12.0" }
kotlin-css = { module = "org.jetbrains.kotlin-wrappers:kotlin-css", version.strictly = "2025.11.12" }
xyz-data-model = { module = "xyz.dussim:data-model" }
androidx-junit = { module = "androidx.test.ext:junit", version.strictly = "1.3.0" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.strictly = "3.7.0" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.strictly = "2.3.0" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.strictly = "1.4.1" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.strictly = "1.4.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle" }
android-library = { id = "com.android.library", version.ref = "android-gradle" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.strictly = "14.0.1" }
gradle-versions = { id = "com.github.ben-manes.versions", version.strictly = "0.53.0" }
application = { id = "org.gradle.application" }
modulegraph = { id = "dev.iurysouza.modulegraph", version.strictly = "0.13.0" }
android-test = { id = "com.android.test", version.ref = "android-gradle" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
gradle-ssh = { id = "xyz.dussim.gradle-ssh", version.require = "0.0.4" }
docker-java-application = { id = "com.bmuschko.docker-java-application", version.require = "10.0.0" }

[bundles]
kotlinx-coroutines = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
kotest = ["kotest-runner-junit5", "kotest-assertions-core", "kotest-property"]
compose-ui = ["androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-foundation"]
voyager = ["voyager-navigator", "voyager-screenmodel", "voyager-transitions"]
ktor-server = [
    "ktor-server-html-builder", "ktor-server-core", "ktor-server-content-negotiation",
    "ktor-serialization-kotlinx-json", "ktor-server-call-logging", "ktor-server-compression",
    "ktor-server-host-common", "ktor-server-status-pages", "ktor-server-resources",
    "ktor-server-netty", "logback-classic"
]
html-css = ["kotlinx-html", "kotlin-css"]
